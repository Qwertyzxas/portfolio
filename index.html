<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Портфолио</title>
    <meta name="description" content="Интерактивное 3D-портфолио: каждая планета — отдельный проект." />
    <meta name="theme-color" content="#05060f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.35'%3E%3Cstop offset='0' stop-color='%23ffe6a8'/%3E%3Cstop offset='.5' stop-color='%23ff8a3d'/%3E%3Cstop offset='1' stop-color='%23b3361a'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='16' fill='url(%23g)'/%3E%3Cellipse cx='32' cy='32' rx='29' ry='9' fill='none' stroke='%239d8cff' stroke-width='3' transform='rotate(-20 32 32)'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene" aria-label="Интерактивная 3D-карта проектов"></canvas>

    <div class="loader" id="loader" role="status">
      <div class="loader__orbit"><span></span></div>
      <p class="loader__text">Запуск двигателей…</p>
    </div>

    <header class="hud hud--top">
      <button class="brand" id="brand" type="button" aria-label="Вернуться к обзору системы">
        <span class="brand__logo" aria-hidden="true"></span>
        <span class="brand__text"><strong data-bind="name"></strong><small data-bind="role"></small></span>
      </button>
      <nav class="nav" aria-label="Основная навигация">
        <button type="button" class="nav__btn" data-action="about">Обо мне</button>
        <button type="button" class="nav__btn" data-action="projects" aria-expanded="false" aria-controls="projects-menu">
          Проекты
        </button>
        <button type="button" class="nav__btn" data-action="contact">Контакты</button>
      </nav>
    </header>

    <div class="projects-menu" id="projects-menu">
      <p class="projects-menu__title">Звёздная карта проектов</p>
      <ul></ul>
    </div>

    <aside class="panel" id="panel" aria-hidden="true">
      <button class="panel__close" id="panel-close" type="button" aria-label="Закрыть и вернуться к системе">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
      <div class="panel__content" id="panel-content"></div>
    </aside>

    <footer class="hud hud--bottom">
      <p class="hint" id="hint"></p>
    </footer>

    <noscript><p class="noscript">Для 3D-портфолио нужен JavaScript.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
